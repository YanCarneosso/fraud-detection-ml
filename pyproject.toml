[project]
name = "fraud-detection-ml"
version = "1.0.0"
description = "Pipeline reproduzível de detecção de fraudes em transações financeiras."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

